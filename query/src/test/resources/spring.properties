# Every test class has its own Spring context (about 64), and all of them create and drop the same SQ_ tables
# (ddl-auto: create-drop). With the default cache of 32 contexts, Spring closes the oldest context when a new one
# starts, and that close drops the tables the running tests use (seen on MariaDB with Spring Boot 3: "Table
# 'SQ_items' doesn't exist", then a pool with no free connection). A cache larger than the number of contexts keeps
# every context open until the end of the run. The database pools close idle connections after 10 s
# (lql-db-*.yaml), so the open contexts do not hold many sessions.
spring.test.context.cache.maxSize=128
