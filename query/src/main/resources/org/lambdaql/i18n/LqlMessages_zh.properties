SORT_UNSUPPORTED_METHOD=不支持此排序方法：by.{0}
SORT_NOT_CHAIN=排序 lambda 必须是 by 调用链，例如 by.asc(...).desc(...)（S4）：{0}
SUBQUERY_OUTER_SUB=内层 lambda 不能使用外层的 sub。请使用 where((x, sub2) -> ...)。
SUBQUERY_FROM_CLASS_LITERAL=sub.from 需要类字面量，例如 Item.class。
SUBQUERY_LIMIT_CONSTANT=子查询的 limit 必须是数字常量。
HOST_VALUE_HAS_ENTITY=在 Java 中计算的值使用了实体：{0}
HOST_NOT_EVALUABLE=此表达式无法在 Java 中计算：{0}
FIELD_UNREADABLE=无法读取字段：{0}
HOST_METHOD_FAILED=在 Java 中计算值时抛出了异常：{0}
HOST_METHOD_UNCALLABLE=无法调用该方法：{0}
HOST_OBJECT_UNCREATABLE=无法创建该对象：{0}
SORT_NO_KEY=没有排序键。请使用 by.asc(...) 或 by.desc(...)。
SORT_KEY_NO_ENTITY=排序键必须使用实体的值。不能按常量或捕获的值排序：{0}
SORT_BY_ENTITY=不能按实体排序。请按 id 等属性排序：{0}
SORT_DIRECTION_FROM_ENTITY=排序方向和 NULL 位置不能来自实体的值：{0}
