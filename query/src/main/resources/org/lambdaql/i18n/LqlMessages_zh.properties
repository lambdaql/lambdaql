CONDITION_IN_SELECT=select、groupBy lambda 中不能有条件（if、?:）（J1）。
CONDITION_IN_SORT=排序 lambda 中不能有条件（if、?:）。请链式调用 by（S4）。
CONDITION_IN_SUBQUERY_VALUE=子查询的值 lambda 中不能有条件。
EMPTY_ARRAY_ELEMENT=数组中有未赋值的元素。
NULL_COMPARE_OPERATOR=null 只能用 == 和 != 比较。
PARAM_NOT_ENTITY=此 lambda 参数不是实体：{0}
FIELD_ACCESS=不能直接读取实体字段。请使用 getter：{0}
EXPRESSION_NOT_SQL=此表达式无法转换为 SQL：{0}
AGG_IN_WHERE=where 中不能使用 Agg 聚合函数。请使用 having（J3）：Agg.{0}
AGG_UNSUPPORTED=不支持此聚合函数：Agg.{0}
AGG_ARG_NO_ENTITY=聚合函数的参数必须使用实体的值：Agg.{0}
METHOD_NOT_SUPPORTED=不支持对实体值调用此方法：{0}
PROPERTY_NOT_FOUND=找不到实体属性：{0}
COLLECTION_PATH=集合属性不能用于路径。请使用子查询：{0}
ENTITY_COMPARE=暂不支持实体之间的比较。请比较 id：{0}
EMBEDDABLE_COMPARE=整个值对象只能与同类型的捕获值对象、同类型的另一个值或 null 做相等比较（equals、==、!=）。请比较其字段：{0}
SUBQUERY_START=子查询必须以 sub.from(...) 开始：{0}
SUBQUERY_WRONG_SUB=子查询必须用此 lambda 的 sub 参数创建。内层 lambda 请使用 where((x, sub2) -> ...)。
