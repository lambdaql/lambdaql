# lambdaQL messages: Chinese (Simplified). UTF-8. Keys are LqlMessage names; {0}, {1} are arguments (no MessageFormat).
# Every key must be in all four files (LqlMessagesTest checks it).
LAMBDA_NULL=lambda 为 null。
LAMBDA_NOT_SERIALIZABLE=只能分析 Serializable 的 lambda。请使用 lambdaQL 的 lambda 类型，而不是 java.util.function：{0}
SERIALIZED_LAMBDA_FAILED=无法获取 {0} 的 SerializedLambda。
NOT_A_LAMBDA=参数是 Serializable 对象而不是 lambda（匿名类、Kotlin object 等）。请写成 lambda：{0}
CLASS_FILE_NOT_FOUND=找不到类文件：{0}
METHOD_NOT_FOUND=类文件中找不到方法：{0}
CLASS_FILE_UNREADABLE=无法读取类文件：{0}
CLASS_NOT_FOUND=找不到类：{0}
METHOD_REFERENCE_IN_WHERE=条件中暂不支持方法引用。请写成 lambda。
METHOD_REFERENCE_IN_ASSIGNMENT=赋值需要 lambda，不能使用方法引用。
METHOD_REFERENCE_IN_SORT_BUILDER=排序构建器需要 lambda，不能使用方法引用（S13）。
METHOD_REFERENCE_NOT_GETTER=方法引用只能是实体的 getter，例如 Order::getPrice（S13）。
INNER_LAMBDA_NOT_INLINE=子查询的 {0} 需要直接写在此处的 lambda，不能使用存放在变量中的 lambda。
END_OF_METHOD=解码超出了方法末尾。
UNINITIALIZED_LOCAL=在赋值之前读取了局部变量：{0}
