ASSIGN_ONLY_SETTERS=赋值 lambda 中只能调用 setter 和 Dml.value(列, 值)（U1）：{0}
ASSIGN_NONE=赋值 lambda 中没有任何赋值（U1）。
VALUE_TARGET=Dml.value 的第一个参数必须是以 getter 调用写出的目标实体属性：{0}
ASSIGN_TWICE=同一列被赋值了两次（U4）：{0}
