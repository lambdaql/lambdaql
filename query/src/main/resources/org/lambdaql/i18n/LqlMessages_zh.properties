ASSIGN_TARGET_NOT_FIRST=赋值目标必须是 lambda 的第一个参数（目标实体）：{0}
ASSIGN_NULL_NOT_NULL=向不能为 NULL 的列赋值 null（U6）：{0}
INSERT_READS_TARGET=insert 的值不能读取新行：{0}
