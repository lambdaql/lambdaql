ARRAY_SIZE_NOT_CONSTANT=lambda 中数组的大小必须是常量。
ARRAY_INDEX_NOT_CONSTANT=只能在常量下标处向数组存值。
STRING_CONCAT_NOT_SUPPORTED=暂不支持字符串拼接（+）。请在 lambda 外构建字符串并捕获它。
INVOKEDYNAMIC_NOT_SUPPORTED=不支持此 invokedynamic：{0}
CONDITION_IN_ASSIGNMENT=赋值 lambda 中不能有条件（if、?:）（U1）。请把条件写在 where 中。
SWITCH_NOT_SUPPORTED=暂不支持 switch（包括 Kotlin 的 when）。
THROW_NOT_SUPPORTED=不支持抛出异常的路径。
NO_RETURN_VALUE=不返回值的 lambda 不是条件或值 lambda。
UNSUPPORTED_INSTRUCTION=不支持此字节码指令：{0}
COMPARE_RESULT_RETURNED=比较结果（-1、0、1）不能直接返回。请进行比较，例如 a.compareTo(b) > 0。
CONSTRUCTOR_TARGET_NOT_NEW=构造函数调用的目标不是 NEW 指令。
VOID_CALL_IN_CONDITION=无返回值的调用不能用于条件 lambda：{0}
UNSUPPORTED_CONSTANT=不支持此常量：{0}
STACK_EMPTY=操作数栈为空。
UNINITIALIZED_OBJECT=在构造函数执行之前使用了对象。
NOT_BOOLEAN_CONDITION=条件 lambda 返回了非 boolean 值。
