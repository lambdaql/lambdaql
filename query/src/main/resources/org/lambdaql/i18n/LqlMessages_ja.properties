METHOD_NOT_FOUND=クラスファイルにメソッドが見つかりません: {0}
CLASS_FILE_UNREADABLE=クラスファイルを読めません: {0}
CLASS_NOT_FOUND=クラスが見つかりません: {0}
METHOD_REFERENCE_IN_WHERE=条件にはまだメソッド参照を使えません。ラムダで書いてください。
METHOD_REFERENCE_IN_ASSIGNMENT=代入にはメソッド参照ではなくラムダを使ってください。
METHOD_REFERENCE_IN_SORT_BUILDER=ソートビルダーにはメソッド参照ではなくラムダを使ってください（S13）。
METHOD_REFERENCE_NOT_GETTER=メソッド参照はエンティティの getter だけに使えます。例: Order::getPrice（S13）。
INNER_LAMBDA_NOT_INLINE=サブクエリの {0} には、変数に入れたラムダではなく、その場で書いたラムダが必要です。
END_OF_METHOD=メソッドの終わりを越えました。
UNINITIALIZED_LOCAL=値が決まる前にローカル変数を読んでいます: {0}
LOCAL_IN_ASSIGNMENT=代入ラムダではローカル変数を使えません（U1）。値を代入文に直接書いてください。
LOOP_NOT_SUPPORTED=ラムダ内のループはサポートしていません。リストはラムダの外で作ってキャプチャしてください。
ARRAY_SIZE_NOT_CONSTANT=ラムダ内の配列サイズは定数でなければなりません。
ARRAY_INDEX_NOT_CONSTANT=配列には定数の位置にだけ値を入れられます。
STRING_CONCAT_NOT_SUPPORTED=文字列の連結（+）はまだサポートしていません。文字列はラムダの外で作ってキャプチャしてください。
INVOKEDYNAMIC_NOT_SUPPORTED=サポートしていない invokedynamic です: {0}
CONDITION_IN_ASSIGNMENT=代入ラムダでは条件（if、?:）を使えません（U1）。条件は where に書いてください。
SWITCH_NOT_SUPPORTED=switch（Kotlin の when を含む）はまだサポートしていません。
THROW_NOT_SUPPORTED=例外を投げる経路はサポートしていません。
NO_RETURN_VALUE=値を返さないラムダは条件ラムダでも値ラムダでもありません。
UNSUPPORTED_INSTRUCTION=サポートしていないバイトコード命令です: {0}
COMPARE_RESULT_RETURNED=比較結果（-1、0、1）はそのまま返せません。a.compareTo(b) > 0 のように比較してください。
CONSTRUCTOR_TARGET_NOT_NEW=コンストラクター呼び出しの対象が NEW 命令ではありません。
VOID_CALL_IN_CONDITION=戻り値のない呼び出しは条件ラムダで使えません: {0}
UNSUPPORTED_CONSTANT=サポートしていない定数です: {0}
STACK_EMPTY=オペランドスタックが空です。
UNINITIALIZED_OBJECT=コンストラクターが実行される前のオブジェクトを値として使っています。
