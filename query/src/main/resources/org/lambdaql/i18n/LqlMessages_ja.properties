# lambdaQL messages: Japanese. UTF-8. Keys are LqlMessage names; {0}, {1} are arguments (no MessageFormat).
# Every key must be in all four files (LqlMessagesTest checks it).
LAMBDA_NULL=ラムダが null です。
LAMBDA_NOT_SERIALIZABLE=Serializable なラムダだけを解析できます。java.util.function ではなく lambdaQL のラムダ型を使ってください: {0}
SERIALIZED_LAMBDA_FAILED={0} の SerializedLambda を取得できませんでした。
NOT_A_LAMBDA=ラムダではない Serializable オブジェクトです（匿名クラス、Kotlin の object など）。ラムダで書いてください: {0}
