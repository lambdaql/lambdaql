METHOD_NOT_SUPPORTED=エンティティの値に対してサポートしていないメソッド呼び出しです: {0}
PROPERTY_NOT_FOUND=エンティティのプロパティが見つかりません: {0}
COLLECTION_PATH=コレクションのプロパティはパスに使えません。サブクエリを使ってください: {0}
ENTITY_COMPARE=エンティティ同士はまだ比較できません。id を比較してください: {0}
