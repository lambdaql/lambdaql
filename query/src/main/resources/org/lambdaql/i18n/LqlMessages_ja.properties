HOST_METHOD_UNCALLABLE=メソッドを呼び出せません: {0}
HOST_OBJECT_UNCREATABLE=オブジェクトを作成できません: {0}
SORT_NO_KEY=ソートキーがありません。by.asc(...) または by.desc(...) を使ってください。
SORT_KEY_NO_ENTITY=ソートキーにはエンティティの値が必要です。定数やキャプチャした値ではソートできません: {0}
SORT_BY_ENTITY=エンティティではソートできません。id などのプロパティでソートしてください: {0}
SORT_DIRECTION_FROM_ENTITY=ソート方向と NULL の位置はエンティティの値で決められません: {0}
GROUP_KEY_NO_ENTITY=グループキーにはエンティティの値が必要です: {0}
NOT_GROUP_KEY=集計と一緒に使う値は groupBy のキーでなければなりません（J3）: {0}
