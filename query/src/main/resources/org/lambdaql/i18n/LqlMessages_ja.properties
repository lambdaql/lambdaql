CONDITION_IN_SORT=ソートラムダでは条件（if、?:）を使えません。by の呼び出しをつなげてください（S4）。
CONDITION_IN_SUBQUERY_VALUE=サブクエリの値ラムダでは条件を使えません。
EMPTY_ARRAY_ELEMENT=値のない配列要素があります。
NULL_COMPARE_OPERATOR=null とは == と != でしか比較できません。
