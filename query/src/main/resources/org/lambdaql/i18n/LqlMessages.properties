# lambdaQL messages: English (root). UTF-8. Keys are LqlMessage names; {0}, {1} are arguments (no MessageFormat).
# Every key must be in all four files (LqlMessagesTest checks it).
LAMBDA_NULL=The lambda is null.
LAMBDA_NOT_SERIALIZABLE=Only Serializable lambdas can be analyzed. Use a lambdaQL lambda type, not java.util.function: {0}
SERIALIZED_LAMBDA_FAILED=Could not get the SerializedLambda of {0}.
NOT_A_LAMBDA=The argument is a Serializable object but not a lambda (an anonymous class or a Kotlin object). Write a lambda: {0}
CLASS_FILE_NOT_FOUND=The class file was not found: {0}
METHOD_NOT_FOUND=The method was not found in the class file: {0}
CLASS_FILE_UNREADABLE=The class file could not be read: {0}
CLASS_NOT_FOUND=The class was not found: {0}
METHOD_REFERENCE_IN_WHERE=A method reference cannot be used as a condition yet. Write a lambda.
METHOD_REFERENCE_IN_ASSIGNMENT=An assignment needs a lambda, not a method reference.
METHOD_REFERENCE_IN_SORT_BUILDER=A sort builder needs a lambda, not a method reference (S13).
METHOD_REFERENCE_NOT_GETTER=A method reference must be a getter of the entity, for example Order::getPrice (S13).
INNER_LAMBDA_NOT_INLINE=The {0} of a subquery needs a lambda written in place, not a lambda stored in a variable.
END_OF_METHOD=The decoder went past the end of the method.
UNINITIALIZED_LOCAL=A local variable is read before it has a value: {0}
LOCAL_IN_ASSIGNMENT=An assignment lambda cannot use local variables (U1). Write the value in the assignment itself.
LOOP_NOT_SUPPORTED=Loops are not supported in a lambda. Build the list outside the lambda and capture it.
ARRAY_SIZE_NOT_CONSTANT=The size of an array in a lambda must be a constant.
ARRAY_INDEX_NOT_CONSTANT=A value can be stored in an array only at a constant index.
STRING_CONCAT_NOT_SUPPORTED=String concatenation (+) is not supported yet. Build the string outside the lambda and capture it.
INVOKEDYNAMIC_NOT_SUPPORTED=This invokedynamic is not supported: {0}
CONDITION_IN_ASSIGNMENT=An assignment lambda cannot have conditions (if, ?:) (U1). Put the condition in where.
SWITCH_NOT_SUPPORTED=switch (and Kotlin when) is not supported yet.
THROW_NOT_SUPPORTED=A path that throws an exception is not supported in a lambda.
NO_RETURN_VALUE=The lambda does not return a value, so it is not a condition or value lambda.
UNSUPPORTED_INSTRUCTION=This bytecode instruction is not supported: {0}
COMPARE_RESULT_RETURNED=A compare result (-1, 0, 1) cannot be returned as it is. Compare it, for example a.compareTo(b) > 0.
CONSTRUCTOR_TARGET_NOT_NEW=The constructor call does not belong to a NEW instruction.
VOID_CALL_IN_CONDITION=A call that returns nothing cannot be used in a condition lambda: {0}
UNSUPPORTED_CONSTANT=This constant is not supported: {0}
STACK_EMPTY=The operand stack is empty.
UNINITIALIZED_OBJECT=An object is used before its constructor runs.
NOT_BOOLEAN_CONDITION=The condition lambda returns a value that is not a boolean.
CONDITION_NOT_RESTORED=The condition could not be rebuilt as a logical expression. Forms that need the same condition more than once (such as a value ternary) are not supported.
CONDITION_IN_SELECT=A select or groupBy lambda cannot have conditions (if, ?:) (J1).
CONDITION_IN_SORT=A sort lambda cannot have conditions (if, ?:). Chain by calls instead (S4).
CONDITION_IN_SUBQUERY_VALUE=A subquery value lambda cannot have conditions.
EMPTY_ARRAY_ELEMENT=An array element has no value.
NULL_COMPARE_OPERATOR=null can only be compared with == and !=.
PARAM_NOT_ENTITY=This lambda parameter is not an entity: {0}
FIELD_ACCESS=An entity field cannot be read directly. Use the getter: {0}
EXPRESSION_NOT_SQL=This expression has no SQL form: {0}
AGG_IN_WHERE=Aggregate functions cannot be used in where. Use having (J3): Agg.{0}
AGG_UNSUPPORTED=This aggregate function is not supported: Agg.{0}
AGG_ARG_NO_ENTITY=The argument of an aggregate function must use an entity value: Agg.{0}
METHOD_NOT_SUPPORTED=This method call on an entity value is not supported: {0}
PROPERTY_NOT_FOUND=The entity property was not found: {0}
COLLECTION_PATH=A collection property cannot be used in a path. Use a subquery: {0}
ENTITY_COMPARE=Entities cannot be compared with each other yet. Compare the ids: {0}
EMBEDDABLE_COMPARE=A whole value object cannot be compared. Compare its fields: {0}
SUBQUERY_START=A subquery must start with sub.from(...): {0}
SUBQUERY_WRONG_SUB=A subquery must be made with the sub parameter of this lambda. An inner lambda uses where((x, sub2) -> ...).
SUBQUERY_NOT_ENTITY=The subquery target must be an entity: {0}
SUBQUERY_UNSUPPORTED_CALL=This call is not supported in a subquery: {0}
SUBQUERY_FIRST_NEEDS_LIMIT=first() needs orderBy(...).limit(1) before it, so that one row is certain (Q3).
SUBQUERY_NEEDS_SELECT=The subquery value must be chosen with select(x -> ...).
SORT_UNSUPPORTED_METHOD=This sort method is not supported: by.{0}
SORT_NOT_CHAIN=A sort lambda must be a chain of by calls, for example by.asc(...).desc(...) (S4): {0}
SUBQUERY_OUTER_SUB=An inner lambda cannot use the outer sub. Use where((x, sub2) -> ...).
SUBQUERY_FROM_CLASS_LITERAL=sub.from needs a class literal, for example Item.class.
SUBQUERY_LIMIT_CONSTANT=A subquery limit must be a number constant.
HOST_VALUE_HAS_ENTITY=A value computed in Java uses an entity: {0}
HOST_NOT_EVALUABLE=This expression cannot be computed in Java: {0}
FIELD_UNREADABLE=The field cannot be read: {0}
HOST_METHOD_FAILED=An exception was thrown while computing a value in Java: {0}
HOST_METHOD_UNCALLABLE=The method cannot be called: {0}
HOST_OBJECT_UNCREATABLE=The object cannot be created: {0}
SORT_NO_KEY=There is no sort key. Use by.asc(...) or by.desc(...).
SORT_KEY_NO_ENTITY=A sort key must use an entity value. A constant or captured value cannot be sorted: {0}
SORT_BY_ENTITY=An entity cannot be a sort key. Sort by a property such as the id: {0}
SORT_DIRECTION_FROM_ENTITY=The sort direction and the NULL position cannot come from an entity value: {0}
GROUP_KEY_NO_ENTITY=A group key must use an entity value: {0}
NOT_GROUP_KEY=A value used with aggregates must be a groupBy key (J3): {0}
HAVING_NOT_GROUP_KEY=A value in having that is not an aggregate must be a groupBy key (J3): {0}
ASSIGN_ONLY_SETTERS=An assignment lambda can only call setters (U1): {0}
ASSIGN_NONE=The assignment lambda assigns nothing (U1).
BY_SET_TARGET=The first argument of by.set must be a property of the target entity: {0}
BY_SET_ONLY=This assignment lambda can only use by.set(column, value): {0}
ASSIGN_TWICE=The same column is assigned twice (U4): {0}
ASSIGN_READS_WRITTEN=A value reads a column that an earlier assignment wrote (U3). In SQL it is the value before the update, and databases differ: {0}
ASSIGN_TARGET_NOT_FIRST=The assignment target must be the first lambda parameter (the target entity): {0}
ASSIGN_NULL_NOT_NULL=null is assigned to a column that can never be NULL (U6): {0}
INSERT_READS_TARGET=An insert value cannot read the new row: {0}
DISTINCT_SORT_NOT_SELECTED=With distinct(), a sort key must be a selected value (J7): {0}
SUBQUERY_OUTER_PATH=A subquery cannot use an association path of the outer entity. Compare the id (foreign key): {0}
CONFLICT_KEY_NOT_COLUMN=The conflict key must be a column of the entity: {0}
SETTER_TARGET=A setter must be called on the entity, or on its value object or association (U1): {0}
ASSOCIATION_ONLY_ID=Only the @Id (foreign key) of an associated entity can be changed (U6): {0}
COLLECTION_ASSIGN=A collection property cannot be assigned (U6): {0}
FUNCTION_NOT_GUARD=A @SqlFunction method must not compute a value in Java. Its body must only throw, for example throw new DbOnlyException(): {0}
FUNCTION_OVERLOAD_MISMATCH=All overloads with the same name must map to the same DB function: {0}
FUNCTION_BUILTIN_NAME=The DB function name {0} is a Hibernate built-in function name. Use a prefix or a schema-qualified name.
FUNCTION_RETURN_TYPE=The return type of the DB function {0} is not supported: {1}. Use Double, Integer, Long, BigDecimal, String, LocalDate, LocalDateTime or Boolean.
FUNCTION_KOTLIN_DEFAULT=A DB function cannot have default arguments (Kotlin): {0}
FUNCTION_VARARG=A DB function cannot have a variable number of arguments (vararg): {0}
FUNCTION_NOT_REGISTERED=The DB function {0} has its own SQL name, so it must be registered. Add its class to the setting lambdaql.functions.classes.
PROC_LAMBDA_SHAPE=A procedure lambda must be one call of a stub method, for example p -> p.calc(id, rate).
PROC_NOT_ANNOTATED=The method is not a @SqlProcedure: {0}
PROC_ARG_NOT_VALUE=A procedure argument must be a captured value, a constant or a calculation of them: {0}
PROC_KOTLIN_DEFAULT=A procedure stub cannot have default arguments (Kotlin): {0}
FUNCTION_CALL_SHAPE=A function call lambda must be one @SqlFunction call, for example () -> OrderFns.discount(price).
DERIVED_ROW_TYPE=The row type of a derived table or CTE must be a Java record or a Kotlin data class (J5): {0}
COMPOSITE_KEY_LIMIT=limit and the one-row protection are not supported yet for an entity with a composite key: {0}
CONFLICT_KEY_MISSING=A value must be assigned to the conflict key {0}.
COMPOSITE_KEY_DML_PATH=An association path with a composite key is not supported in DML yet.
SORT_DIRECTION_NULL=The sort direction (Direction) is null: {0}
NULLS_FIRST_NULL=The nullsFirst value is null: {0}
NULL_BOOLEAN_CONDITION=A null Boolean is used as a condition (Java would throw NullPointerException): {0}
IN_COLLECTION_NULL=The collection for IN is null (Java would throw NullPointerException).
IN_COLLECTION_NULL_ELEMENT=The collection for IN has a null element.
NULL_ORDER_COMPARE=A null value cannot be compared with <, <=, > or >= (Java would throw NullPointerException): {0}
VALUE_NOT_RENDERABLE=This value cannot be written in HQL: {0}
NULL_EQUALS=equals is called on a null value (Java would throw NullPointerException): {0}
NULL_METHOD_CALL=A method is called on a null value (Java would throw NullPointerException): {0}
NULL_ARITHMETIC=A null value is used in arithmetic: {0}
LIMIT_NEGATIVE=limit must be 0 or more: {0}
OFFSET_NEGATIVE=offset must be 0 or more: {0}
EXECUTE_ONE_WITH_LIMIT=executeOne() cannot be used with limit or orderBy.
ORDER_BY_NEEDS_LIMIT=orderBy() in update or delete needs limit().
UPSERT_COMPOSITE_KEY=upsert of an entity with a composite key needs onConflict(key): {0}
SET_SIZE_MISMATCH=toSet/findSet: {0} rows became {1} elements in the set. The entity equals/hashCode treats different rows as equal, or the @Id is not unique. Use toList().
RESULT_CONSTRUCTOR_NOT_FOUND=The result constructor was not found: {0}
NULL_INTO_PRIMITIVE=A NULL value cannot go into a primitive constructor argument (J4). Change argument {0} to a wrapper type (Long, Double, ...): {1}
RESULT_OBJECT_FAILED=The result object could not be created: {0}
MORE_THAN_ONE_ROW_CHANGED=Two or more rows match the condition, so nothing was changed (one-row protection): {0}
TRANSACTION_REQUIRED=UPDATE, INSERT and DELETE need a transaction. Run them inside @Transactional or a transaction you started.
MORE_THAN_ONE_ROW=Two or more rows match one(). Narrow the condition or use first(): {0}
SORT_SPEC_TYPE=The SortSpec is for {0}, not for {1}.
SORT_PATH_EMPTY=The sort path is empty.
SORT_PATH_UNKNOWN=The sort path has an unknown property: {0} (path {1})
SORT_PATH_NOT_VALUE=A sort path must end with a value property: {0}
SORT_PATH_MIDDLE=The middle of a sort path must be a to-one association or a value object: {0} (path {1})
DIRECTION_NULL=The direction is null.
PLACEHOLDER_CALLED={0} only works inside a lambdaQL lambda. It is a placeholder and is never run.
IGNORE_CASE_NOT_SUPPORTED=An ignoreCase sort is not supported yet: {0}
DB_ONLY_CALLED={0} is a database function. It works only inside a lambdaQL lambda and is never run in Java.
PROC_NOT_FOUND=The procedure was not found in the database: {0}
PROC_SIGNATURE_MISMATCH=The stub does not match the database procedure {0}: {1}
PROC_EXEC_HAS_OUT=exec cannot call a procedure with OUT parameters, because their values would be lost. Use call: {0}
PROC_RESULT_SHAPE=The return type of {0} does not match the procedure results: {1}
PROC_NULL_INTO_PRIMITIVE=The procedure returned NULL, but the result type cannot hold NULL. Use a nullable type (Double, Integer, Kotlin Double? ...): {0}
SORT_NOT_ALLOWED=Sorting by this name is not allowed for {0}: {1}. Allow it with SortRules (allow or alias).
SORT_RULE_NOT_PATH=A sort rule must be a column of the entity, for example o -> o.getPrice(): {0}
SORT_UNKNOWN_ENTITY=lambdaql.sort: no entity has this JPA entity name (by default the simple class name, or @Entity(name = ...)): {0}
PROC_ARG_ORDER=The stub arguments of {0} have the database parameter names in another order. Stub: {1}, database: {2}
PROC_OVERLOADED=The Oracle package has several procedures with this name (overloads); lambdaQL cannot tell which one to call: {0}
NULL_CAPTURED_COMPARE=A captured value is null in {0}. In SQL, = NULL and <> NULL match no row; use x == null in the lambda, or check the value before the query.
INTERNAL_ERROR=Internal error in lambdaQL. Please report it: {0}
SUBQUERY_SORT_REMOVED=A subquery sort without limit does not change the result, so it was removed (Q4): {0}
SORT_NOT_ALLOWED_WARN=An outside sort is not in the sort rules of {0}: {1}. It runs now; with SortMode.STRICT it would be rejected.
PROC_NAMES_UNAVAILABLE=The stub argument names are not in the class file, so the argument order of {0} is not checked. Compile with -parameters (Kotlin: -java-parameters) or use @DbParam.
PROC_METADATA_UNAVAILABLE=The parameters of {0} could not be read from the database metadata ({1}). The stub is not checked; IN and INOUT parameters are taken in stub order, then the OUT parameters.
PROC_OVERLOAD_CHECK_SKIPPED=The overloads of {0} could not be checked ({1}); the call goes on without the check.
SARGABLE_COLUMN_FUNCTION=The function {0} is applied to the column {1}, so a normal index on the column cannot be used and the query may scan the whole table. Compare the column with a value instead, or (Oracle) create a function-based index: {2}
SARGABLE_NONDETERMINISTIC=The MariaDB function {0} is NOT DETERMINISTIC, so it is computed for every row and an index on the compared column is not used for a range. Declare it DETERMINISTIC if it is: {1}
SARGABLE_CHECK_SKIPPED=The index or function metadata for {0} could not be read ({1}); the SARGable check goes on without it.
SQL_NULL_MEANING=SQL meaning: in {0}, a row whose value is NULL does not match (Java would treat null differently). Add a null check such as x == null || ... to include it.
