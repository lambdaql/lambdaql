PROC_OVERLOAD_CHECK_SKIPPED={0}의 오버로드를 확인하지 못했습니다({1}). 확인 없이 호출합니다.
SARGABLE_COLUMN_FUNCTION=함수 {0}가 열 {1}에 씌워져 있어 열의 일반 인덱스를 쓸 수 없고 전체 스캔이 될 수 있습니다. 열을 값과 비교하도록 바꾸거나 (Oracle) 함수 기반 인덱스를 만드세요: {2}
SARGABLE_NONDETERMINISTIC=MariaDB 함수 {0}가 NOT DETERMINISTIC이라 행마다 다시 계산되고, 비교하는 열의 인덱스를 범위 검색에 쓰지 못합니다. 결정적 함수라면 DETERMINISTIC으로 선언하세요: {1}
SARGABLE_CHECK_SKIPPED={0}의 인덱스·함수 메타데이터를 읽지 못했습니다({1}). 메타데이터 없이 SARGable 검사를 계속합니다.
SQL_NULL_MEANING=SQL 의미: {0}에서 값이 NULL인 행은 조건에 맞지 않습니다(Java의 null 처리와 다름). 포함하려면 x == null || ...처럼 null 검사를 적으세요.
LOB_IN_SORT_OR_KEY=열 {0}은 @Lob 열입니다. 일부 DB(예: Oracle)는 LOB를 {1}에 쓸 수 없습니다.
