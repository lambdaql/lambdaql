plugins {
 	id 'java-library'
	id 'maven-publish'
	// Kotlin is used only for tests (ROADMAP D17, KOTLIN.md 7). The published jar has no Kotlin dependency:
	// kotlin.stdlib.default.dependency=false in gradle.properties keeps kotlin-stdlib out of the main scope.
	id 'org.jetbrains.kotlin.jvm' version '2.3.21'
}

// the Spring Boot BOM would pin Kotlin 1.9; the Kotlin tests use the compiler version
ext['kotlin.version'] = '2.3.21'

// Kotlin tests live in src/test/kotlin as their own source set. They see the compiled Java test classes
// (the Lombok entities in src/test/java), the same way a user project sees compiled entities.
sourceSets {
	// the Kotlin plugin adds src/test/kotlin to the test source set by default; it belongs to kotlinTest here
	test {
		kotlin.srcDirs = []
	}
	kotlinTest {
		kotlin.srcDir 'src/test/kotlin'
		java.srcDirs = []
		resources.srcDirs = []
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	kotlinTestImplementation.extendsFrom testImplementation
	kotlinTestRuntimeOnly.extendsFrom testRuntimeOnly
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
	}
}

dependencies {

	// ASM 9.11.1: class file major 72(Java 28)까지 읽음. 9.7은 Java 23(major 67)까지라 JDK 24+로 컴파일된 람다를 읽지 못함.
	// LambdaPredicateVisitor 등이 ASM 타입(MethodVisitor)을 공개 API로 노출하므로 api 로 선언.
	// 새 JDK 릴리스(6개월 주기)마다 최신 ASM으로 갱신 필요.
	api 'org.ow2.asm:asm:9.11.1'
	implementation 'org.ow2.asm:asm-tree:9.11.1'
	implementation 'org.ow2.asm:asm-util:9.11.1'


	// lambdaql-core has no Spring dependency (ROADMAP D34). JPA and Hibernate are given by the user at run time.
	compileOnly 'jakarta.persistence:jakarta.persistence-api'
	// Hibernate 6.6 is given by the user at run time; core uses it only for DB function registration (ROADMAP M11)
	compileOnly 'org.hibernate.orm:hibernate-core'
	implementation 'org.slf4j:slf4j-api'

	// Lombok only for the test entities (main code has none since the old org.lambdaql.function package was removed)
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

	//test
	testCompileOnly('org.projectlombok:lombok:1.18.36')

	testImplementation("org.springframework.boot:spring-boot-starter-test:3.4.2")
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//	testImplementation 'org.springframework.boot:spring-boot-logging'

	//testImplementation("com.hunet.common:core-datasource:1.0.0")
	testImplementation("org.springframework.boot:spring-boot-starter-jdbc")
	testImplementation("ch.qos.logback:logback-core:1.5.17")
	testImplementation("com.h2database:h2:2.3.230")
	testImplementation 'org.jinq:jinq-jpa:2.0.2'
	// Optional verification on MariaDB / Oracle: ./gradlew :query:test -Dlql.db=mariadb|oracle
	testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.6'
	testRuntimeOnly 'com.oracle.database.jdbc:ojdbc11:23.26.0.0.0'

	// Kotlin tests (src/test/kotlin)
	kotlinTestImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'

}

test{
	useJUnitPlatform()
	// the Kotlin tests run in the same task, so -Dlql.db and the SQL files work the same way
	testClassesDirs += sourceSets.kotlinTest.output.classesDirs
	classpath += sourceSets.kotlinTest.runtimeClasspath
	// -Dlql.db=mariadb|oracle makes application-test.yaml import src/test/resources/lql-db-<name>.yaml
	// (DatabaseSelectionTest fails if the connected database is not the chosen one)
	systemProperty 'lql.db', System.getProperty('lql.db', 'h2')
	// -Dlql.sql.update=true makes SqlByDatabaseTest write src/test/resources/expected-sql/<db>.sql again
	systemProperty 'lql.sql.update', System.getProperty('lql.sql.update', 'false')

	testLogging {
		events "passed", "skipped", "failed"
	}
}

javadoc {
	// Javadoc examples come from the test code:
	//   {@snippet class="org.lambdaql.engine.decode.ConditionDecodeTest" region="or-chain"}
	// The test files mark the code with  // @start region="..."  and  // @end
	options.addStringOption('-snippet-path', file('src/test/java').absolutePath)
}
