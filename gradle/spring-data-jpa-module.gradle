// lambdaql-spring-data-jpa for one Spring Boot line (ROADMAP D55), applied by spring-data-jpa-boot3 and
// spring-data-jpa-boot4. The code and the tests are shared in the folder spring-data-jpa/ (not a Gradle project);
// each module adds only the few classes that differ between the Spring Data versions (src/main/java of the module)
// and chooses its Spring Boot BOM with lql.springBoot in its gradle.properties.

apply plugin: 'java-library'
apply plugin: 'maven-publish'

def shared = rootProject.file('spring-data-jpa/src')

sourceSets {
	main {
		java.srcDirs = [file('src/main/java'), new File(shared, 'main/java')]
		resources.srcDirs = [new File(shared, 'main/resources')]
	}
	test {
		java.srcDirs = [new File(shared, 'test/java')]
		resources.srcDirs = [new File(shared, 'test/resources')]
	}
}

dependencies {
	api project(':query')
	// Spring Data JPA 3.4+ (fragments from spring.factories, RepositoryMetadataAccess); ROADMAP SD8
	api 'org.springframework.data:spring-data-jpa'
	api 'jakarta.persistence:jakarta.persistence-api'
	// the auto-configuration is read only by Spring Boot; the executor works without Boot
	compileOnly 'org.springframework.boot:spring-boot-autoconfigure'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.h2database:h2:2.3.230'
	testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.6'
	testRuntimeOnly 'com.oracle.database.jdbc:ojdbc11:23.26.0.0.0'
	testRuntimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.mysql:mysql-connector-j'
}

test {
	useJUnitPlatform()
	// -Dlql.db=mariadb|oracle|postgresql|mysql makes application-test.yaml import src/test/resources/lql-db-<name>.yaml
	systemProperty 'lql.db', System.getProperty('lql.db', 'h2')
	testLogging {
		events "passed", "skipped", "failed"
	}
}

// testClassFile: the same tests on JDK 24+, where lambdaql-core reads lambdas with java.lang.classfile (D52).
// The test class path already has the lambdaql-core jar (a project dependency), so nothing else is needed.
apply from: rootProject.file('gradle/classfile-test.gradle')

javadoc {
	// Javadoc examples come from the test code ({@snippet ... region="..."})
	options.addStringOption('-snippet-path', new File(shared, 'test/java').absolutePath)
}
