// The java.lang.classfile reader test (ROADMAP D52), applied by the modules that analyze lambdas.
//
// lambdaql-core is a Multi-Release JAR: Java 21-23 read class files with ASM, Java 24 and later with
// java.lang.classfile (META-INF/versions/24). The task testClassFile runs the same tests on JDK 24+ with the jar
// on the class path, so the JVM picks the java.lang.classfile reader. "test" (JDK 21) is followed by it, so
//   ./gradlew test -Dlql.db=h2|mariadb|oracle
// checks both readers. Results: build/test-results/testClassFile
//
// The JDK version is -Plql.classfile.jdk (default 25). Gradle finds it among the installed JDKs
// (org.gradle.java.installations.paths in ~/.gradle/gradle.properties).

ext.classFileJdk = JavaLanguageVersion.of((findProperty('lql.classfile.jdk') ?: '25') as int)

def testClassFile = tasks.register('testClassFile', Test) {
	description = 'Runs the tests with the Multi-Release JAR on JDK 24+, so the java.lang.classfile reader is used.'
	group = 'verification'
	javaLauncher = javaToolchains.launcherFor { languageVersion = classFileJdk }
	useJUnitPlatform()
	// read when the task runs, so changes made later to the test task (Kotlin test folders) are seen
	testClassesDirs = files({ tasks.test.testClassesDirs })
	// a module can change this (lambdaql-core puts its own jar in place of its class folders)
	classpath = files({ tasks.test.classpath })
	systemProperty 'lql.db', System.getProperty('lql.db', 'h2')
	// the SQL answer files are written by the test task only
	systemProperty 'lql.sql.update', 'false'
	systemProperty 'lql.reader.expected', 'classfile'
	// one database schema is shared, so this task never runs at the same time as test
	mustRunAfter tasks.test
	doFirst {
		// "test --tests X" also limits this task (unless it has its own --tests)
		if (filter.commandLineIncludePatterns.isEmpty()) {
			filter.commandLineIncludePatterns = tasks.test.filter.commandLineIncludePatterns
		}
		filter.failOnNoMatchingTests = tasks.test.filter.failOnNoMatchingTests
	}
	testLogging {
		events "passed", "skipped", "failed"
	}
}

tasks.named('test', Test) {
	// the tests on JDK 21 use ASM (lambdaql-core's own tests use its class folders, other modules the jar)
	systemProperty 'lql.reader.expected', 'asm'
	finalizedBy testClassFile
}
tasks.named('check') { dependsOn testClassFile }
