# Imported by application-test.yaml when the tests run with -Dlql.db=oracle (local Oracle verification schema).
# The password is read from the environment variable LQL_DB_PASSWORD (never written to a file).
spring:
  datasource:
    url: ${LQL_ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${LQL_ORACLE_USER:LQL}
    password: ${LQL_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    # Oracle Free allows few sessions; each cached test context keeps its own pool (ORA-12516 otherwise)
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  jpa:
    properties:
      hibernate.physical_naming_strategy: org.lambdaql.spring.sample.SqPrefixNamingStrategy
