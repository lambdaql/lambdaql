plugins {
	id 'java-library'
	id 'maven-publish'
	// Kotlin only for tests (the manual's Kotlin track, ROADMAP D56); the jar has no Kotlin dependency
	id 'org.jetbrains.kotlin.jvm' version '2.3.21'
}

// the Spring Boot BOM would pin an older Kotlin; the Kotlin tests use the compiler version
ext['kotlin.version'] = '2.3.21'

// Kotlin tests live in src/test/kotlin as their own source set and see the compiled Java test classes
// (the entities and repositories in src/test/java), as in the query module
sourceSets {
	test {
		kotlin.srcDirs = []
	}
	kotlinTest {
		kotlin.srcDir 'src/test/kotlin'
		java.srcDirs = []
		resources.srcDirs = []
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	kotlinTestImplementation.extendsFrom testImplementation
	kotlinTestRuntimeOnly.extendsFrom testRuntimeOnly
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
	}
}

// lambdaql-spring-data-jpa: one jar for Spring Boot 3 (Spring Data 3.5) and Spring Boot 4 (Spring Data 4.1)
// (ROADMAP D55). It is compiled against Spring Boot 4; testBoot3 runs the same compiled tests on Spring Boot 3.
// Spring Data and Spring Boot are compileOnly: the user's project gives them, so this jar never changes their version.

dependencies {
	api project(':query')
	// Spring Data JPA 3.4+ (fragments from spring.factories, RepositoryMetadataAccess); ROADMAP SD8
	compileOnly 'org.springframework.data:spring-data-jpa'
	compileOnly 'jakarta.persistence:jakarta.persistence-api'
	// the auto-configuration is read only by Spring Boot; the executor works without Boot
	compileOnly 'org.springframework.boot:spring-boot-autoconfigure'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.h2database:h2:2.3.230'
	testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.6'
	testRuntimeOnly 'com.oracle.database.jdbc:ojdbc11:23.26.0.0.0'
	testRuntimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.mysql:mysql-connector-j'

	// Kotlin tests (src/test/kotlin)
	kotlinTestImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
	// Spring Data needs kotlin-reflect for Kotlin repositories (NoClassDefFoundError ReflectJvmMapping without it)
	kotlinTestRuntimeOnly 'org.jetbrains.kotlin:kotlin-reflect:2.3.21'
}

test {
	useJUnitPlatform()
	// the Kotlin tests run in the same task
	testClassesDirs += sourceSets.kotlinTest.output.classesDirs
	classpath += sourceSets.kotlinTest.runtimeClasspath
	// -Dlql.db=mariadb|oracle|postgresql|mysql makes application-test.yaml import src/test/resources/lql-db-<name>.yaml
	systemProperty 'lql.db', System.getProperty('lql.db', 'h2')
	testLogging {
		events "passed", "skipped", "failed"
	}
}

// testClassFile: the same tests on JDK 24+, where lambdaql-core reads lambdas with java.lang.classfile (D52).
// The test class path already has the lambdaql-core jar (a project dependency), so nothing else is needed.
apply from: rootProject.file('gradle/classfile-test.gradle')
// testBoot3: the same compiled tests on Spring Boot 3 (Spring Data 3.5, Hibernate 6.6)
apply from: rootProject.file('gradle/boot3-test.gradle')

javadoc {
	// Javadoc examples come from the test code ({@snippet ... region="..."})
	options.addStringOption('-snippet-path', file('src/test/java').absolutePath)
}
