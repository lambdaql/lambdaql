plugins {
	id 'java'
	id 'org.jetbrains.kotlin.jvm' version '2.3.21'
}

// Runs the tests of lambdaql-core (query/src/test) on Spring Boot 3 and Hibernate 6.6 (ROADMAP D55). Not published.
// lambdaql-core is one jar for both lines; the query module runs the same tests on Spring Boot 4 and Hibernate 7.
// Hibernate 6 writes some SQL differently, so the SQL answer files of this module are in
// query-test-boot3/src/test/resources/expected-sql (the tests read src/test/resources/expected-sql of the module
// they run in).
//   ./gradlew :query-test-boot3:test -Dlql.db=h2|mariadb|oracle|postgresql|mysql

// the Spring Boot BOM would pin an older Kotlin; the Kotlin tests use the compiler version
ext['kotlin.version'] = '2.3.21'

def shared = rootProject.file('query/src/test')

sourceSets {
	test {
		java.srcDirs = [new File(shared, 'java')]
		kotlin.srcDirs = []
		resources.srcDirs = [new File(shared, 'resources')]
	}
	kotlinTest {
		kotlin.srcDirs = [new File(shared, 'kotlin')]
		java.srcDirs = []
		resources.srcDirs = []
		compileClasspath += sourceSets.test.output
		runtimeClasspath += sourceSets.test.output
	}
}

configurations {
	kotlinTestImplementation.extendsFrom testImplementation
	kotlinTestRuntimeOnly.extendsFrom testRuntimeOnly
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
	}
}

dependencies {
	testImplementation project(':query')
	// the tests read bytecode with ASM directly (lambdaql-core has it as an implementation dependency)
	testImplementation 'org.ow2.asm:asm:9.11.1'
	testImplementation 'org.ow2.asm:asm-tree:9.11.1'
	testImplementation 'org.ow2.asm:asm-util:9.11.1'
	testImplementation 'org.hibernate.orm:hibernate-core'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
	testCompileOnly 'org.projectlombok:lombok:1.18.36'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
	testImplementation 'com.h2database:h2:2.3.230'
	testImplementation 'org.jinq:jinq-jpa:2.0.2'
	testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.6'
	testRuntimeOnly 'com.oracle.database.jdbc:ojdbc11:23.26.0.0.0'
	testRuntimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.mysql:mysql-connector-j'
	kotlinTestImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
}

// stub argument names for the procedure name check (ROADMAP M11, PR2)
compileTestJava {
	options.compilerArgs << '-parameters'
	options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
	testClassesDirs += sourceSets.kotlinTest.output.classesDirs
	classpath += sourceSets.kotlinTest.runtimeClasspath
	systemProperty 'lql.db', System.getProperty('lql.db', 'h2')
	systemProperty 'lql.sql.update', System.getProperty('lql.sql.update', 'false')
	testLogging {
		events "passed", "skipped", "failed"
	}
}

// testClassFile: the same tests on JDK 24+ with the lambdaql-core jar (the java.lang.classfile reader, D52)
apply from: rootProject.file('gradle/classfile-test.gradle')
