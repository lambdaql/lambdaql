pluginManagement {
    //플러그인 넥서스
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'lambdaql'

// Spring Boot lines (ROADMAP D55): lambdaql-core and lambdaql-spring-data-jpa are one jar each for Spring Boot 3 and 4.
// They are compiled against Spring Boot 4; testBoot3 (gradle/boot3-test.gradle) runs the same tests on Spring Boot 3.
// Only the starters depend on the Spring Boot line: their names end with -boot3 / -boot4.
// query                       -> lambdaql-core: engine and QueryBuilder, no Spring dependency
// spring-data-jpa             -> lambdaql-spring-data-jpa: repository executor fragment and Boot auto-configuration
// spring-boot-starter-boot3/4 -> lambdaql-spring-boot-starter-boot3/4: dependencies only, for each Spring Boot line
// benchmark                   -> not published: JDBC, JPQL, Criteria API and lambdaQL on the same queries (JMH)
include 'query'
include 'spring-data-jpa'
include 'spring-boot-starter-boot3'
include 'spring-boot-starter-boot4'
include 'benchmark'
