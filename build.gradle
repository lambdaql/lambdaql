plugins {
    id 'idea'
    id("org.jetbrains.gradle.plugin.idea-ext") version "1.1.10"
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.kordamp.gradle.profiles' version "0.54.0"
}

println("gradle version: ${gradle.gradleVersion}")

idea {
    project {
        settings {
            encodings {
                encoding = "UTF-8"
                properties {
                    encoding = "UTF-8"
                }
            }
        }
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy {
            preferProjectModules()
            cacheDynamicVersionsFor 0, 'seconds'
            cacheChangingModulesFor 0, 'seconds'
        }
    }
}

subprojects { subproject ->

    repositories {
        mavenLocal()
//        maven {
//            url = project.properties["repository.public.url"] as String
//        }
        mavenCentral()
    }

    // Spring Boot BOM 기본 설정
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            // the Spring Boot line of the module: lql.springBoot in its gradle.properties (default in the root
            // gradle.properties). Modules for Boot 3 end with -boot3 and set 3.x (ROADMAP D55)
            mavenBom("org.springframework.boot:spring-boot-dependencies:${subproject.findProperty('lql.springBoot')}")
        }
    }

    // profile 설정
    profiles {
        profile('snapshot') {
            action {
                project.version += '-SNAPSHOT'
            }
        }
    }

    plugins.withId('java') {
        def javaVersion = properties.getOrDefault("jvm.version", 21) as int
        java {
            // The Gradle daemon runs on JDK 25 (gradle/gradle-daemon-jvm.properties), but compiling and the default
            // tests use JDK 21: the lowest Java version lambdaQL supports, and the bytecode a Java 21 user's javac
            // makes. Kotlin follows this toolchain too. src/main/java24 and testClassFile choose their own JDK.
            toolchain {
                languageVersion.set(JavaLanguageVersion.of(javaVersion))
            }
            [compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
        }
    }

    // a module can choose its artifact name with lql.artifactName in its gradle.properties
    // (the "query" folder is published as lambdaql, ROADMAP D64)
    def artifactName = subproject.findProperty('lql.artifactName') ?: "${rootProject.name}-${project.name}"

    plugins.withId('java-library') {
        jar {
            archiveBaseName = artifactName
            archiveClassifier = ""
        }
    }

    plugins.withId('maven-publish') {
        println("  maven-publish plugin is enabled ${project.group}:${artifactName}:${project.version} jdk:${project.java.sourceCompatibility}")
        // maven publish 할때 javadoc, sources 추가
        javadoc {
            options.encoding = 'UTF-8'
            options.docEncoding = 'UTF-8'
            options.charSet = "UTF-8"

            copy {
                from "src/main/docs"
                into javadoc.destinationDir
            }
        }

        subproject.publishing {
            publications {
                maven(MavenPublication) {
                    from components.java
                    //jar 파일인 경우 artifactId 변경
                    artifactId = artifactName
                    versionMapping {
                        allVariants {
                            fromResolutionResult()
                        }
                    }
                    java {
                        withSourcesJar()
                    }
                    // the information Maven Central requires in every POM
                    pom {
                        name = artifactName
                        description = subproject.findProperty('lql.description') ?: 'lambdaQL: JPA queries written as Java and Kotlin lambda expressions'
                        url = 'https://github.com/lambdaql/lambdaql'
                        licenses {
                            license {
                                name = 'The Apache License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }
                        developers {
                            developer {
                                id = 'lambdaql'
                                name = 'lambdaQL'
                                organizationUrl = 'https://github.com/lambdaql'
                            }
                        }
                        scm {
                            connection = 'scm:git:https://github.com/lambdaql/lambdaql.git'
                            developerConnection = 'scm:git:ssh://git@github.com/lambdaql/lambdaql.git'
                            url = 'https://github.com/lambdaql/lambdaql'
                        }
                    }
                }
            }
            /*repositories {
                maven {
                    name = "nexus"
                    url = version.endsWith('-SNAPSHOT') ?
                            project.properties.get("repository.snapshot.url"):
                            project.properties.get("repository.release.url")
                    def nexusId = project.properties.getOrDefault('nexus.id', System.getenv('NEXUS_ID'))
                    def nexusPassword = project.properties.getOrDefault('nexus.password', System.getenv('NEXUS_PASSWORD'))
                    credentials {
                        username = nexusId
                        password = nexusPassword
                    }
                }
            }*/
        }
    }
}