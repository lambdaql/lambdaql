plugins {
	id 'java-library'
	id 'maven-publish'
}

// No code: one dependency for Spring Boot 3 users (ROADMAP D34, D55).
// The auto-configuration itself is in lambdaql-spring-data-jpa (one jar for Spring Boot 3 and 4); this starter adds
// the Spring Boot 3 starter, so the Spring Data JPA and Hibernate versions match Spring Boot 3.
dependencies {
	api project(':spring-data-jpa')
	api 'org.springframework.boot:spring-boot-starter-data-jpa'
}
